name: Build

on:
  push:
    branches: [ "1.21.1-1.1" ]
  pull_request:
    branches: [ "1.21.1-1.1" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout Deep Aether
        uses: actions/checkout@v4

      - name: Checkout The Aether (Curios API)
        uses: actions/checkout@v4
        with:
          repository: king146464646/The-Aether-CuriosAPI
          ref: 1.21.1-develop
          path: The-Aether-CuriosAPI

      - name: 'Checkout The Aether: Genesis (Curios API)'
        uses: actions/checkout@v4
        with:
          repository: king146464646/The-Aether-Genesis-CuriosAPI
          ref: 1.21.1-develop
          path: The-Aether-Genesis-CuriosAPI

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@af1da67850ed9a4cedd57bfd976089dd991e2582 # v4.0.0

      - name: Publish The Aether (Curios API) to mavenLocal
        working-directory: The-Aether-CuriosAPI
        run: |
          chmod +x ./gradlew
          ./gradlew publishToMavenLocal --console=plain

      - name: 'Build The Aether: Genesis (Curios API)'
        working-directory: The-Aether-Genesis-CuriosAPI
        run: |
          chmod +x ./gradlew
          ./gradlew build --console=plain
          cp build/libs/*.jar "${GITHUB_WORKSPACE}/libs/"

      - name: Build with Gradle Wrapper
        run: |
          chmod +x ./gradlew
          ./gradlew build

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: deep-aether-${{ github.sha }}
          path: build/libs/*.jar
          if-no-files-found: error
